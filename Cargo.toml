[workspace]
resolver = "3"
members = [
    "crates/lim-core",
    "crates/lim-config",
    "crates/lim-llm",
    "crates/lim-agent",
    "crates/lim-executor",
    "crates/lim-skills",
    "crates/lim-tools",
    "crates/lim-session",
    "crates/lim-workflow",
    "apps/cli",
    "apps/tui",
    "packs/novel",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/palering/lim"

[workspace.dependencies]
# Internal crates
lim-core = { path = "crates/lim-core" }
lim-config = { path = "crates/lim-config" }
lim-llm = { path = "crates/lim-llm" }
lim-agent = { path = "crates/lim-agent" }
lim-executor = { path = "crates/lim-executor" }
lim-tools = { path = "crates/lim-tools" }
lim-session = { path = "crates/lim-session" }
lim-workflow = { path = "crates/lim-workflow" }
lim-skills = { path = "crates/lim-skills" }
lim-tui = { path = "apps/tui" }
novel-pack = { path = "packs/novel" }

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# IDs
ulid = { version = "1", features = ["serde"] }

# Paths
camino = { version = "1", features = ["serde1"] }

# Logging
tracing = "0.1"

# Schema generation
schemars = "0.8"

# Async streams
futures = "0.3"

# Async trait
async-trait = "0.1"

# Schema validation
jsonschema = "0.46"

# Base64 encoding
base64 = "0.22"

# HTTP client for LLM providers
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }

# Async streams
tokio-stream = "0.1"

# CLI
clap = { version = "4", features = ["derive"] }

# Logging output
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# SSE parsing
eventsource-stream = "0.2"

# TOML config
toml = "0.8"

# TUI
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }

[profile.release]
# Reduce binary size and enable cross-module optimization.
# Trade-off: slower build (~2-3x), but smaller + faster runtime binary.
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

# Faster dev iteration — keep debug info but skip optimizations.
[profile.dev]
debug = 1
