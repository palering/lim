version: 2
updates:
  # GitHub Actions — keep workflow actions up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      # minor + patch 合并到单个 PR（通常无 breaking change）
      # major 保持默认：每个依赖单独 PR（breaking change 需独立审查）
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # Cargo crates — keep Rust dependencies up to date
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "cargo"
    groups:
      # minor + patch 合并到单个 PR（通常无 breaking change）
      # major 保持默认：每个依赖单独 PR（breaking change 需独立审查）
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
